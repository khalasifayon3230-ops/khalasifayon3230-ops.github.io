<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dream Hunt | Admin Login</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial, sans-serif;
    background:#f4f6f9;
}

.login-box{
    width:90%;
    max-width:400px;
    background:white;
    padding:35px 25px;
    border-radius:18px;
    box-shadow:0 10px 35px rgba(0,0,0,0.12);
}

.logo{
    text-align:center;
    font-size:30px;
    font-weight:800;
    color:#111;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#777;
    margin-bottom:30px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
    color:#333;
}

input{
    width:100%;
    padding:14px;
    margin-bottom:20px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#111;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#111;
    color:white;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.message{
    text-align:center;
    margin-top:18px;
    font-size:14px;
}

</style>

</head>

<body>

<div class="login-box">

    <div class="logo">
        Dream Hunt
    </div>

    <div class="subtitle">
        Admin Panel
    </div>

    <form id="adminLoginForm">

        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Admin email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Admin password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <div class="message" id="message"></div>

</div>

<script>

document
.getElementById("adminLoginForm")
.addEventListener("submit", function(e){

    e.preventDefault();

    document.getElementById("message").innerText =
        "Admin authentication will be connected in the next step.";

});

</script>

</body>

</html>
