<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Notifications | Dream Hunt</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{

    --bg:#03050d;

    --card:rgba(11,16,31,.84);

    --card2:rgba(15,21,40,.92);

    --line:rgba(255,255,255,.075);

    --white:#f5f7ff;

    --muted:#8792aa;

    --blue:#4f8cff;

    --cyan:#31d9ff;

    --purple:#9a68ff;

    --green:#36e5a1;

}


/* =========================================================
   BODY
========================================================= */

html{
    scroll-behavior:smooth;
}

body{

    min-height:100vh;

    color:var(--white);

    font-family:
        Inter,
        Arial,
        sans-serif;

    background:

        radial-gradient(
            circle at 8% 0%,
            rgba(65,110,255,.18),
            transparent 28%
        ),

        radial-gradient(
            circle at 92% 8%,
            rgba(155,92,255,.17),
            transparent 28%
        ),

        radial-gradient(
            circle at 50% 100%,
            rgba(0,211,255,.08),
            transparent 35%
        ),

        linear-gradient(
            135deg,
            #02040b,
            #070b17 55%,
            #03050d
        );

    overflow-x:hidden;
}


/* =========================================================
   AURA
========================================================= */

.aura{

    position:fixed;

    border-radius:50%;

    pointer-events:none;

    filter:blur(110px);

    opacity:.24;

    z-index:0;
}

.aura.one{

    width:350px;
    height:350px;

    left:-150px;
    top:-150px;

    background:#326eff;

    animation:
        auraOne
        12s
        ease-in-out
        infinite
        alternate;
}

.aura.two{

    width:370px;
    height:370px;

    right:-160px;
    top:25%;

    background:#914fff;

    animation:
        auraTwo
        15s
        ease-in-out
        infinite
        alternate;
}

.aura.three{

    width:300px;
    height:300px;

    left:40%;
    bottom:-170px;

    background:#00cfff;

    animation:
        auraThree
        13s
        ease-in-out
        infinite
        alternate;
}

@keyframes auraOne{

    to{
        transform:
            translate(
                100px,
                110px
            );
    }

}

@keyframes auraTwo{

    to{
        transform:
            translate(
                -90px,
                -70px
            );
    }

}

@keyframes auraThree{

    to{
        transform:
            translate(
                60px,
                -70px
            );
    }

}


/* =========================================================
   PAGE
========================================================= */

.page{

    position:relative;

    z-index:1;

    width:100%;

    max-width:1200px;

    margin:auto;

    padding:
        34px
        30px
        70px;
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:25px;
}

.brand{

    display:flex;

    align-items:center;

    gap:12px;
}

.brand-mark{

    width:45px;
    height:45px;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:14px;

    font-size:15px;

    font-weight:950;

    background:

        linear-gradient(
            135deg,
            #4f8cff,
            #9864ff
        );

    box-shadow:

        0 0 30px
        rgba(79,140,255,.35);
}

.brand-name{

    font-size:16px;

    font-weight:900;
}

.brand-sub{

    margin-top:3px;

    color:#586681;

    font-size:8px;

    letter-spacing:2px;
}

.account{

    display:flex;

    align-items:center;

    gap:8px;

    padding:
        10px
        13px;

    border-radius:13px;

    background:
        rgba(8,13,27,.75);

    border:
        1px solid
        var(--line);
}

.account-dot{

    width:7px;
    height:7px;

    border-radius:50%;

    background:var(--green);

    box-shadow:
        0 0 12px
        var(--green);
}

.account-email{

    color:#929db5;

    font-size:10px;
}


/* =========================================================
   ERROR
========================================================= */

.error{

    display:none;

    margin-bottom:15px;

    padding:
        13px
        15px;

    border-radius:13px;

    background:
        rgba(255,75,105,.07);

    border:
        1px solid
        rgba(255,75,105,.17);

    color:#ff7890;

    font-size:10px;
}


/* =========================================================
   HERO
========================================================= */

.hero{

    position:relative;

    min-height:270px;

    padding:
        43px;

    border-radius:29px;

    overflow:hidden;

    background:

        linear-gradient(
            120deg,
            rgba(13,25,58,.96),
            rgba(7,11,25,.93)
        );

    border:
        1px solid
        rgba(79,140,255,.16);

    box-shadow:

        0 30px 80px
        rgba(0,0,0,.32);

    margin-bottom:25px;
}

.hero-grid{

    position:absolute;

    inset:0;

    background-image:

        linear-gradient(
            rgba(255,255,255,.035) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,255,255,.035) 1px,
            transparent 1px
        );

    background-size:45px 45px;

    mask-image:

        linear-gradient(
            to right,
            black,
            transparent
        );
}

.hero-glow{

    position:absolute;

    width:320px;
    height:320px;

    right:-80px;
    top:-140px;

    border-radius:50%;

    border:
        1px solid
        rgba(99,150,255,.13);

    box-shadow:

        0 0 0 45px
        rgba(99,150,255,.025),

        0 0 0 90px
        rgba(99,150,255,.018),

        0 0 0 135px
        rgba(99,150,255,.012);
}

.hero-content{

    position:relative;

    z-index:2;
}

.tag{

    display:inline-flex;

    align-items:center;

    gap:7px;

    padding:
        7px
        11px;

    border-radius:100px;

    color:#8eb4ff;

    background:
        rgba(79,140,255,.07);

    border:
        1px solid
        rgba(79,140,255,.17);

    font-size:8px;

    font-weight:900;

    letter-spacing:1.6px;

    margin-bottom:17px;
}

.hero h1{

    font-size:45px;

    line-height:1.03;

    letter-spacing:-2.2px;
}

.hero h1 span{

    background:

        linear-gradient(
            90deg,
            #65a1ff,
            #a876ff,
            #45dcff
        );

    -webkit-background-clip:text;

    color:transparent;
}

.hero p{

    max-width:670px;

    color:#8995ad;

    font-size:12px;

    line-height:1.8;

    margin-top:15px;
}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{

    display:flex;

    justify-content:space-between;

    align-items:flex-end;

    margin:
        0
        0
        15px;
}

.section-title{

    font-size:20px;

    font-weight:900;
}

.section-sub{

    color:#606d86;

    font-size:9px;

    margin-top:4px;
}

.refresh{

    border:
        1px solid
        rgba(79,140,255,.2);

    background:
        rgba(79,140,255,.07);

    color:#8caeff;

    padding:
        9px
        13px;

    border-radius:11px;

    cursor:pointer;

    font-size:10px;

    font-weight:850;

    transition:.25s;
}

.refresh:hover{

    transform:
        translateY(-2px);

    background:
        rgba(79,140,255,.14);
}

.refresh.loading span{

    display:inline-block;

    animation:
        spin
        .7s
        linear
        infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =========================================================
   NOTIFICATION LIST
========================================================= */

.notifications{

    display:flex;

    flex-direction:column;

    gap:13px;
}


/* =========================================================
   NOTIFICATION CARD
========================================================= */

.notification{

    position:relative;

    padding:
        21px
        23px;

    border-radius:19px;

    background:

        linear-gradient(
            145deg,
            rgba(17,24,45,.90),
            rgba(8,12,25,.86)
        );

    border:
        1px solid
        rgba(255,255,255,.07);

    box-shadow:

        0 18px 45px
        rgba(0,0,0,.22);

    overflow:hidden;

    transition:.3s;
}

.notification:hover{

    transform:
        translateY(-3px);

    border-color:
        rgba(79,140,255,.22);

    box-shadow:

        0 25px 55px
        rgba(0,0,0,.30),

        0 0 30px
        rgba(79,140,255,.05);
}

.notification:before{

    content:"";

    position:absolute;

    left:0;
    top:0;
    bottom:0;

    width:3px;

    background:

        linear-gradient(
            #4f8cff,
            #9a68ff
        );
}


/* =========================================================
   NOTIFICATION HEADER
========================================================= */

.notification-head{

    display:flex;

    align-items:flex-start;

    justify-content:space-between;

    gap:20px;

    margin-bottom:10px;
}

.notification-title{

    display:flex;

    align-items:center;

    gap:10px;
}

.notification-icon{

    width:38px;
    height:38px;

    flex-shrink:0;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:11px;

    background:
        rgba(79,140,255,.08);

    border:
        1px solid
        rgba(79,140,255,.13);

    font-size:16px;
}

.notification h2{

    font-size:16px;

    font-weight:900;

    line-height:1.35;
}


/* =========================================================
   STATUS
========================================================= */

.status{

    padding:
        6px
        9px;

    border-radius:8px;

    color:#73a5ff;

    background:
        rgba(79,140,255,.07);

    border:
        1px solid
        rgba(79,140,255,.12);

    font-size:7px;

    font-weight:950;

    text-transform:uppercase;

    white-space:nowrap;
}


/* =========================================================
   MESSAGE
========================================================= */

.message{

    color:#8d98ae;

    font-size:11px;

    line-height:1.8;

    white-space:pre-line;

    margin-left:48px;

    margin-bottom:13px;
}


/* =========================================================
   BOTTOM
========================================================= */

.notification-bottom{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-left:48px;

    padding-top:11px;

    border-top:
        1px solid
        rgba(255,255,255,.055);
}

.date{

    color:#59657d;

    font-size:9px;
}

.notification-label{

    color:#65718a;

    font-size:8px;

    font-weight:800;

    letter-spacing:.5px;
}


/* =========================================================
   EMPTY
========================================================= */

.empty{

    padding:
        70px
        20px;

    text-align:center;

    border-radius:21px;

    border:
        1px dashed
        rgba(255,255,255,.09);

    background:
        rgba(8,12,24,.48);
}

.empty-icon{

    width:64px;
    height:64px;

    display:flex;

    align-items:center;
    justify-content:center;

    margin:
        0 auto
        15px;

    border-radius:19px;

    background:
        rgba(79,140,255,.07);

    border:
        1px solid
        rgba(79,140,255,.12);

    font-size:26px;
}

.empty h2{

    font-size:18px;

    margin-bottom:7px;
}

.empty p{

    color:#68748c;

    font-size:10px;
}


/* =========================================================
   LOADING
========================================================= */

.loading{

    min-height:240px;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    gap:13px;

    color:#66728b;

    font-size:10px;
}

.loader{

    width:34px;
    height:34px;

    border-radius:50%;

    border:
        3px solid
        rgba(255,255,255,.07);

    border-top-color:
        var(--blue);

    animation:
        spin
        .7s
        linear
        infinite;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    .page{

        padding:
            20px
            14px
            50px;
    }

    .account-email{
        display:none;
    }

    .hero{

        min-height:290px;

        padding:
            31px
            23px;

        border-radius:24px;
    }

    .hero h1{

        font-size:35px;
    }

    .hero p{

        font-size:10px;
    }

    .toolbar{

        align-items:flex-end;

        gap:10px;
    }

    .section-title{

        font-size:18px;
    }

    .notification{

        padding:
            18px
            17px;
    }

    .notification-head{

        flex-direction:column;

        gap:10px;
    }

    .status{

        margin-left:48px;
    }

    .message{

        margin-left:0;

        margin-top:12px;
    }

    .notification-bottom{

        margin-left:0;
    }

}


@media(max-width:420px){

    .brand-name{
        font-size:14px;
    }

    .hero h1{
        font-size:30px;
    }

    .toolbar{
        gap:7px;
    }

    .refresh{
        padding:
            8px
            10px;
    }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(
    prefers-reduced-motion:reduce
){

    *{
        animation:none !important;
        transition:none !important;
    }

}

</style>

</head>


<body>


<!-- =====================================================
     BACKGROUND
===================================================== -->

<div class="aura one"></div>

<div class="aura two"></div>

<div class="aura three"></div>


<!-- =====================================================
     PAGE
===================================================== -->

<main class="page">


<!-- =====================================================
     TOP BAR
===================================================== -->

<header class="topbar">

    <div class="brand">

        <div class="brand-mark">
            DH
        </div>

        <div>

            <div class="brand-name">
                Dream Hunt
            </div>

            <div class="brand-sub">
                STUDENT NOTIFICATIONS
            </div>

        </div>

    </div>


    <div class="account">

        <div class="account-dot"></div>

        <div
            class="account-email"
            id="userEmail"
        >
            Connecting...
        </div>

    </div>

</header>


<!-- =====================================================
     ERROR
===================================================== -->

<div
    class="error"
    id="errorBox"
></div>


<!-- =====================================================
     HERO
===================================================== -->

<section class="hero">

    <div class="hero-grid"></div>

    <div class="hero-glow"></div>


    <div class="hero-content">

        <div class="tag">

            ✦ DREAM HUNT UPDATES

        </div>


        <h1>

            Stay in the<br>

            <span>loop.</span>

        </h1>


        <p>

            Important announcements, exam updates,
            admission information, results and other
            updates from Dream Hunt — all in one place.

        </p>

    </div>

</section>


<!-- =====================================================
     TOOLBAR
===================================================== -->

<div class="toolbar">

    <div>

        <div class="section-title">
            Notifications
        </div>

        <div class="section-sub">
            Latest updates from Dream Hunt
        </div>

    </div>


    <button
        class="refresh"
        id="refreshBtn"
        onclick="loadNotifications(true)"
    >

        <span>↻</span>

        Refresh

    </button>

</div>


<!-- =====================================================
     NOTIFICATIONS
===================================================== -->

<section
    class="notifications"
    id="content"
>

    <div class="loading">

        <div class="loader"></div>

        Loading notifications...

    </div>

</section>


</main>


<script>

/* =========================================================
   SUPABASE CONFIG
   UNCHANGED
========================================================= */

const SUPABASE_URL =
    "https://rndtgjuwwsxxiiezennr.supabase.co";


const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_mIQfKUUsEOlDtqEdroMpgQ_I8ElRcsN";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   DATE
========================================================= */

function formatDate(value){

    if(!value)
        return "Date unavailable";


    const date =
        new Date(value);


    if(
        isNaN(
            date.getTime()
        )
    ){

        return "Date unavailable";

    }


    return date.toLocaleString(
        "en-GB",
        {
            day:"2-digit",
            month:"short",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit"
        }
    );

}


/* =========================================================
   ERROR
========================================================= */

function showError(message){

    const box =
        document.getElementById(
            "errorBox"
        );


    box.textContent =
        message;


    box.style.display =
        "block";

}


function hideError(){

    document.getElementById(
        "errorBox"
    ).style.display =
        "none";

}


/* =========================================================
   AUTH
========================================================= */

async function checkUser(){

    const {
        data,
        error
    } =
    await supabaseClient.auth.getSession();


    if(error)
        throw error;


    if(
        !data ||
        !data.session
    ){

        window.location.href =
            "login.html";

        return false;

    }


    const user =
        data.session.user;


    document.getElementById(
        "userEmail"
    ).textContent =
        user.email ||
        "Student";


    return true;

}


/* =========================================================
   LOAD NOTIFICATIONS
========================================================= */

async function loadNotifications(
    isRefresh = false
){

    const button =
        document.getElementById(
            "refreshBtn"
        );


    if(isRefresh){

        button.classList.add(
            "loading"
        );

    }


    hideError();


    try{

        const authenticated =
            await checkUser();


        if(!authenticated)
            return;


        /*
         * IMPORTANT
         *
         * NO SUPABASE STRUCTURE CHANGE.
         *
         * Only existing notification
         * columns are used:
         *
         * id
         * title
         * message
         * is_active
         * created_at
         */

        const {
            data,
            error
        } =
        await supabaseClient

            .from("notifications")

            .select(
                "id,title,message,is_active,created_at"
            )

            .eq(
                "is_active",
                true
            )

            .order(
                "created_at",
                {
                    ascending:false
                }
            );


        if(error)
            throw error;


        renderNotifications(
            data || []
        );


    }
    catch(error){

        console.error(
            "Notification error:",
            error
        );


        showError(
            error?.message ||
            "Unable to load notifications."
        );


        showEmpty(
            "Unable to load notifications",
            "Please try again later."
        );

    }
    finally{

        button.classList.remove(
            "loading"
        );

    }

}


/* =========================================================
   RENDER NOTIFICATIONS
========================================================= */

function renderNotifications(
    notifications
){

    const content =
        document.getElementById(
            "content"
        );


    if(
        !Array.isArray(
            notifications
        )
        ||
        notifications.length === 0
    ){

        showEmpty(
            "No Notifications",
            "You don't have any notifications right now."
        );

        return;

    }


    let html = "";


    notifications.forEach(
        item => {


            const title =
                escapeHTML(
                    item.title ||
                    "Dream Hunt Update"
                );


            const message =
                escapeHTML(
                    item.message ||
                    ""
                );


            const date =
                formatDate(
                    item.created_at
                );


            html += `

                <article
                    class="notification"
                >


                    <div
                        class="notification-head"
                    >


                        <div
                            class="notification-title"
                        >


                            <div
                                class="notification-icon"
                            >

                                🔔

                            </div>


                            <h2>

                                ${title}

                            </h2>


                        </div>


                        <div
                            class="status"
                        >

                            DREAM HUNT

                        </div>


                    </div>


                    <div
                        class="message"
                    >

                        ${message}

                    </div>


                    <div
                        class="notification-bottom"
                    >


                        <div
                            class="date"
                        >

                            ${date}

                        </div>


                        <div
                            class="notification-label"
                        >

                            DREAM HUNT

                        </div>


                    </div>


                </article>

            `;

        }
    );


    content.innerHTML =
        html;

}


/* =========================================================
   EMPTY STATE
========================================================= */

function showEmpty(
    title,
    message
){

    document.getElementById(
        "content"
    ).innerHTML = `

        <div class="empty">


            <div class="empty-icon">

                🔔

            </div>


            <h2>

                ${escapeHTML(
                    title
                )}

            </h2>


            <p>

                ${escapeHTML(
                    message
                )}

            </p>


        </div>

    `;

}


/* =========================================================
   START
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        loadNotifications(false);

    }
);

</script>

</body>

</html>
