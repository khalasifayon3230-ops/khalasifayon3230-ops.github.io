<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://rndtgjuwwsxxiiezennr.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_mIQfKUUsEOlDtqEdroMpgQ_I8ElRcsN";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   GLOBALS
========================================================= */

let checkout = null;

let selectedMethod = "bKash";


/* =========================================================
   LOAD CHECKOUT
========================================================= */

function loadCheckout(){

    const sessionPrimary =
        sessionStorage.getItem(
            "dreamHuntCheckout"
        );

    const sessionSecondary =
        sessionStorage.getItem(
            "dream_hunt_course_order"
        );

    const localBackup =
        localStorage.getItem(
            "dreamHuntCheckoutBackup"
        );

    const raw =
        sessionPrimary ||
        sessionSecondary ||
        localBackup;

    if(!raw){

        showError(
            "No checkout information was found. Please return to Buy Courses and select your package again."
        );

        document.getElementById(
            "paymentArea"
        ).style.display = "none";

        return false;
    }


    try{

        checkout =
            JSON.parse(raw);

    }catch(error){

        console.error(
            "Checkout JSON error:",
            error
        );

        showError(
            "Your checkout information is invalid. Please select your package again."
        );

        document.getElementById(
            "paymentArea"
        ).style.display = "none";

        return false;
    }


    console.log(
        "Checkout loaded:",
        checkout
    );

    renderCheckout();

    return true;
}


/* =========================================================
   RENDER CHECKOUT
========================================================= */

function renderCheckout(){

    const box =
        document.getElementById(
            "selectedPackage"
        );

    const selected =
        Array.isArray(checkout.selectedItems)
            ? checkout.selectedItems
            : (
                Array.isArray(checkout.selected)
                    ? checkout.selected
                    : []
            );

    let html = "";


    if(selected.length){

        selected.forEach(item => {

            let title =
                item.name ||
                item.title ||
                item.label ||
                item.category ||
                "Selected Course";

            let subtitle =
                item.subtitle ||
                item.unit ||
                item.description ||
                "";


            html += `

                <div class="package">

                    <div>

                        <div class="package-title">
                            ${escapeHTML(title)}
                        </div>

                        ${
                            subtitle
                            ? `
                                <div class="package-sub">
                                    ${escapeHTML(subtitle)}
                                </div>
                            `
                            : ""
                        }

                    </div>

                </div>

            `;

        });

    }else{

        const categories =
            Array.isArray(checkout.categories)
                ? checkout.categories
                : [];

        categories.forEach(category => {

            html += `

                <div class="package">

                    <div class="package-title">
                        ${escapeHTML(category)}
                    </div>

                </div>

            `;

        });

    }


    const subtotal =
        Number(
            checkout.subtotal || 0
        );

    const discount =
        Number(
            checkout.discount || 0
        );

    const total =
        Number(
            checkout.finalAmount ??
            checkout.payableAmount ??
            checkout.totalAmount ??
            checkout.amount ??
            checkout.total ??
            0
        );


    html += `

        <div style="margin-top:20px">

            <div class="summary-row">

                <span>
                    Subtotal
                </span>

                <strong>
                    ৳${formatMoney(subtotal)}
                </strong>

            </div>


            ${
                discount > 0
                ? `
                    <div class="summary-row">

                        <span>
                            Coupon Discount
                        </span>

                        <strong class="discount">
                            -৳${formatMoney(discount)}
                        </strong>

                    </div>
                `
                : ""
            }


            <div class="summary-row total">

                <span>
                    Total
                </span>

                <strong>
                    ৳${formatMoney(total)}
                </strong>

            </div>

        </div>

    `;


    box.innerHTML = html;
}


/* =========================================================
   PAYMENT METHOD
========================================================= */

function selectMethod(element){

    document
        .querySelectorAll(".method")
        .forEach(el => {

            el.classList.remove(
                "active"
            );

        });


    element.classList.add(
        "active"
    );


    selectedMethod =
        element.dataset.method;
}


/* =========================================================
   CATEGORY → COURSE NAME
========================================================= */

const COURSE_NAME_MAP = {

    engineering:
        "Engineering Admission",

    medical:
        "Medical & Dental Admission",

    dental:
        "Medical & Dental Admission",

    "medical-dental":
        "Medical & Dental Admission",

    agricultural:
        "Agriculture & Veterinary Admission",

    agriculture:
        "Agriculture & Veterinary Admission",

    "agriculture-veterinary":
        "Agriculture & Veterinary Admission",

    textile:
        "Specialized Admission",

    specialized:
        "Specialized Admission",

    "specialized-admission":
        "Specialized Admission",

    "public-university":
        "Public University Admission",

    public:
        "Public University Admission",

    "public university":
        "Public University Admission",

    "public-university-admission":
        "Public University Admission",

    ab:
        "Abroad Preparation",

    abroad:
        "Abroad Preparation",

    "abroad-preparation":
        "Abroad Preparation",

    "abroad prep":
        "Abroad Preparation",

    sat:
        "Abroad Preparation",

    ielts:
        "Abroad Preparation"

};


/* =========================================================
   NORMALIZE
========================================================= */

function normalize(value){

    return String(
        value || ""
    )
    .trim()
    .toLowerCase()
    .replace(
        /&/g,
        "and"
    )
    .replace(
        /[^a-z0-9]+/g,
        " "
    )
    .trim();
}


/* =========================================================
   GET CHECKOUT CATEGORIES
========================================================= */

function getCheckoutCategories(){

    let categories = [];


    if(
        checkout &&
        Array.isArray(
            checkout.categories
        )
    ){

        categories =
            checkout.categories;

    }


    if(
        !categories.length &&
        checkout &&
        Array.isArray(
            checkout.orderCategories
        )
    ){

        categories =
            checkout.orderCategories;

    }


    if(
        !categories.length &&
        checkout &&
        Array.isArray(
            checkout.courseSlugs
        )
    ){

        categories =
            checkout.courseSlugs;

    }


    return [

        ...new Set(

            categories
                .map(
                    x => normalize(x)
                )
                .filter(Boolean)

        )

    ];

}


/* =========================================================
   FIND EXISTING COURSE IDS
========================================================= */

async function findCourseIds(){

    const {
        data,
        error
    } =
        await supabaseClient
            .from("courses")
            .select(
                "id,name,slug,category,is_active,is_published"
            )
            .eq(
                "is_active",
                true
            )
            .eq(
                "is_published",
                true
            );


    if(error){

        console.error(
            "Course query error:",
            error
        );

        throw new Error(
            "Could not read available courses from Supabase."
        );

    }


    if(
        !Array.isArray(data) ||
        !data.length
    ){

        throw new Error(
            "No active and published courses were found."
        );

    }


    console.log(
        "Courses returned:",
        data
    );


    const categories =
        getCheckoutCategories();


    const requiredNames = [];


    categories.forEach(
        category => {

            const mapped =
                COURSE_NAME_MAP[
                    category
                ];


            if(mapped){

                requiredNames.push(
                    normalize(mapped)
                );

            }

        }
    );


    /*
       Fallback:
       Inspect selectedItems.
    */

    if(
        !requiredNames.length &&
        checkout &&
        Array.isArray(
            checkout.selectedItems
        )
    ){

        checkout.selectedItems.forEach(
            item => {

                const text =
                    normalize(
                        item.name ||
                        item.title ||
                        item.category ||
                        ""
                    );


                if(text){

                    const mapped =
                        COURSE_NAME_MAP[
                            text
                        ];


                    if(mapped){

                        requiredNames.push(
                            normalize(mapped)
                        );

                    }else{

                        requiredNames.push(
                            text
                        );

                    }

                }

            }
        );

    }


    const uniqueRequired =
        [
            ...new Set(
                requiredNames
            )
        ];


    const matched = [];


    uniqueRequired.forEach(
        required => {

            let row =
                data.find(
                    course =>
                        normalize(
                            course.name
                        ) === required
                );


            if(!row){

                row =
                    data.find(
                        course =>
                            normalize(
                                course.slug
                            ) === required
                    );

            }


            if(!row){

                row =
                    data.find(
                        course => {

                            const name =
                                normalize(
                                    course.name
                                );


                            return (
                                name.includes(
                                    required
                                ) ||
                                required.includes(
                                    name
                                )
                            );

                        }
                    );

            }


            if(row){

                if(
                    !matched.some(
                        x =>
                            x.id === row.id
                    )
                ){

                    matched.push(
                        row
                    );

                }

            }

        }
    );


    /*
       Extra fallback:
       directly match selectedItems.
    */

    if(
        !matched.length &&
        checkout &&
        Array.isArray(
            checkout.selectedItems
        )
    ){

        checkout.selectedItems.forEach(
            item => {

                const text =
                    normalize(
                        item.name ||
                        item.title ||
                        item.category ||
                        ""
                    );


                if(!text){
                    return;
                }


                const row =
                    data.find(
                        course => {

                            const name =
                                normalize(
                                    course.name
                                );

                            const slug =
                                normalize(
                                    course.slug
                                );


                            return (
                                name.includes(text) ||
                                text.includes(name) ||
                                slug.includes(text) ||
                                text.includes(slug)
                            );

                        }
                    );


                if(
                    row &&
                    !matched.some(
                        x =>
                            x.id === row.id
                    )
                ){

                    matched.push(
                        row
                    );

                }

            }
        );

    }


    if(!matched.length){

        console.error(
            "Checkout categories:",
            categories
        );

        console.error(
            "Required names:",
            uniqueRequired
        );

        console.error(
            "Available courses:",
            data
        );

        throw new Error(
            "Invalid or unavailable course. Please return to Buy Courses and select your package again."
        );

    }


    return matched;
}


/* =========================================================
   BUILD RPC PRICES
========================================================= */

function buildRPCPrices(courseRows){

    const total =
        Number(
            checkout.finalAmount ??
            checkout.payableAmount ??
            checkout.totalAmount ??
            checkout.amount ??
            checkout.total ??
            0
        );


    /*
       Existing order pricing logic preserved.

       The total amount is attached to the first
       broad course row, while other rows remain 0.
    */

    return courseRows.map(
        (_, index) =>
            index === 0
                ? total
                : 0
    );
}


/* =========================================================
   BUILD SELECTED DATA
========================================================= */

function buildSelectedData(
    transactionId,
    hscRoll,
    hscRegistration,
    amount
){

    return {

        source:
            "dream-hunt-buy-courses",

        selected:
            checkout.selected || [],

        selectedItems:
            checkout.selectedItems || [],

        categories:
            checkout.categories || [],

        orderCategories:
            checkout.orderCategories || [],

        courseSlugs:
            checkout.courseSlugs || [],

        courseIds:
            checkout.courseIds || [],

        courseNames:
            checkout.courseNames || [],

        selectedMainCategories:
            checkout.selectedMainCategories || [],

        selectedAbroad:
            checkout.selectedAbroad || [],

        subtotal:
            Number(
                checkout.subtotal || 0
            ),

        discount:
            Number(
                checkout.discount || 0
            ),

        coupon:
            checkout.coupon ||
            checkout.couponCode ||
            "",

        total:
            Number(
                checkout.total || 0
            ),

        amount:
            amount,

        payableAmount:
            Number(
                checkout.payableAmount || 0
            ),

        finalAmount:
            Number(
                checkout.finalAmount || 0
            ),

        payment: {

            method:
                selectedMethod,

            transaction_id:
                transactionId,

            hsc_roll:
                hscRoll,

            hsc_registration:
                hscRegistration,

            submitted_at:
                new Date().toISOString()

        }

    };
}


/* =========================================================
   SUBMIT PAYMENT
========================================================= */

async function submitPayment(){

    const submitBtn =
        document.getElementById(
            "submitBtn"
        );


    const transactionId =
        document
            .getElementById(
                "transactionId"
            )
            .value
            .trim();


    const hscRoll =
        document
            .getElementById(
                "hscRoll"
            )
            .value
            .trim();


    const hscRegistration =
        document
            .getElementById(
                "hscRegistration"
            )
            .value
            .trim();


    if(!transactionId){

        showError(
            "Please enter your Transaction ID."
        );

        return;
    }


    if(!hscRoll){

        showError(
            "Please enter your HSC Roll."
        );

        return;
    }


    if(!hscRegistration){

        showError(
            "Please enter your HSC Registration."
        );

        return;
    }


    if(!checkout){

        showError(
            "No checkout information was found. Please return to Buy Courses."
        );

        return;
    }


    submitBtn.disabled = true;

    submitBtn.innerText =
        "Checking account...";


    try{

        /*
           CHECK LOGIN
        */

        const {
            data: userData,
            error: userError
        } =
            await supabaseClient
                .auth
                .getUser();


        if(
            userError ||
            !userData ||
            !userData.user
        ){

            window.location.href =
                "login.html?redirect=payment.html";

            return;
        }


        submitBtn.innerText =
            "Finding course...";


        /*
           FIND COURSE IDs
        */

        const courseRows =
            await findCourseIds();


        if(
            !courseRows ||
            !courseRows.length
        ){

            throw new Error(
                "Invalid or unavailable course."
            );

        }


        const courseIds =
            courseRows.map(
                row => row.id
            );


        const prices =
            buildRPCPrices(
                courseRows
            );


        const amount =
            Number(
                checkout.finalAmount ??
                checkout.payableAmount ??
                checkout.totalAmount ??
                checkout.amount ??
                checkout.total ??
                0
            );


        /*
           EXACT DATA TO SAVE
        */

        const selectedData =
            buildSelectedData(
                transactionId,
                hscRoll,
                hscRegistration,
                amount
            );


        console.log(
            "Matched courses:",
            courseRows
        );

        console.log(
            "RPC course IDs:",
            courseIds
        );

        console.log(
            "RPC prices:",
            prices
        );

        console.log(
            "Selected data:",
            selectedData
        );


        submitBtn.innerText =
            "Submitting order...";


        /*
           NEW RPC

           create_student_order(
               UUID[],
               NUMERIC[],
               TEXT,
               TEXT,
               TEXT,
               JSONB
           )
        */

        const {
            data: orderData,
            error: orderError
        } =
            await supabaseClient
                .rpc(
                    "create_student_order",
                    {

                        p_course_ids:
                            courseIds,

                        p_prices:
                            prices,

                        p_transaction_id:
                            transactionId,

                        p_payment_method:
                            selectedMethod,

                        p_coupon_code:
                            checkout.coupon ||
                            checkout.couponCode ||
                            "",

                        p_selected_data:
                            selectedData

                    }
                );


        if(orderError){

            console.error(
                "RPC error:",
                orderError
            );

            throw new Error(
                orderError.message ||
                "Could not create your order."
            );

        }


        /*
           EXTRACT ORDER ID
        */

        let orderId =
            extractOrderId(
                orderData
            );


        if(!orderId){

            orderId =
                "DH-" +
                Date.now();

        }


        /*
           LOCAL BACKUP

           Database is now the primary source.
           LocalStorage is only a backup.
        */

        const paymentRecord = {

            order_id:
                orderId,

            user_id:
                userData.user.id,

            payment_method:
                selectedMethod,

            transaction_id:
                transactionId,

            hsc_roll:
                hscRoll,

            hsc_registration:
                hscRegistration,

            amount:
                amount,

            coupon:
                checkout.coupon ||
                checkout.couponCode ||
                "",

            selected_courses:
                checkout.selectedItems ||
                checkout.selected ||
                [],

            selected_categories:
                checkout.categories ||
                [],

            selected_data:
                selectedData,

            status:
                "PENDING",

            approval_status:
                "WAITING_FOR_APPROVAL",

            created_at:
                new Date().toISOString()

        };


        localStorage.setItem(
            "dreamHuntPayment_" +
            orderId,

            JSON.stringify(
                paymentRecord
            )
        );


        localStorage.setItem(
            "dreamHuntLatestPayment",

            JSON.stringify(
                paymentRecord
            )
        );


        /*
           SHOW SUCCESS
        */

        showSuccess(
            paymentRecord,
            courseRows
        );


    }catch(error){

        console.error(
            "Payment submit error:",
            error
        );


        showError(
            error.message ||
            "Something went wrong while submitting your payment."
        );


        submitBtn.disabled = false;

        submitBtn.innerText =
            "Submit Payment";

    }

}


/* =========================================================
   EXTRACT ORDER ID
========================================================= */

function extractOrderId(data){

    if(!data){

        return null;
    }


    if(
        typeof data === "number"
    ){

        return data;
    }


    if(
        typeof data === "string"
    ){

        return data;
    }


    if(
        typeof data === "object"
    ){

        return (

            data.id ||

            data.order_id ||

            data.orderId ||

            data[0]?.id ||

            data[0]?.order_id ||

            data[0]?.orderId ||

            null

        );

    }


    return null;
}

                    </span>

                    </span>

/* =========================================================
   ERROR
========================================================= */

function showError(text){

    document.getElementById(
        "message"
    ).innerHTML = `

        <div class="error">

            ${escapeHTML(text)}

        </div>

    `;
}


/* =========================================================
   BACK
========================================================= */

function goBack(){

    window.location.href =
        "buy-courses.html";
}


/* =========================================================
   FORMAT MONEY
========================================================= */

function formatMoney(value){

    return Number(
        value || 0
    ).toLocaleString(
        "en-BD"
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}

   INIT
