/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   DATE FORMAT
========================================================= */

function formatDate(date) {

    if (!date) {
        return "—";
    }

    return new Date(date).toLocaleString(
        "en-BD",
        {
            day: "2-digit",
            month: "short",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}


/* =========================================================
   MONEY FORMAT
========================================================= */

function formatAmount(amount) {

    return "৳" +
        Number(amount || 0)
            .toLocaleString("en-BD");
}


/* =========================================================
   CATEGORY NORMALIZER
========================================================= */

function normalizeCategories(categories) {

    if (!Array.isArray(categories)) {
        return [];
    }


    const slugMap = {

        "Public University":
            "public-university",

        "Public University Admission":
            "public-university",

        "Engineering":
            "engineering",

        "Engineering Admission":
            "engineering",

        "Medical":
            "medical-dental",

        "Medical & Dental":
            "medical-dental",

        "Medical & Dental Admission":

            "agriculture-veterinary",

        "Agriculture & Veterinary":
            "agriculture-veterinary",

        "Agriculture & Veterinary Admission":
            "agriculture-veterinary",

        "Specialized":
            "specialized-admission",

        "Specialized Admission":
            "specialized-admission",

        "Abroad":
            "abroad-prep",

        "Abroad Prep":
            "abroad-prep",

        "Abroad Preparation":
            "abroad-prep"
    };


    return categories
        .map(
            item =>
                slugMap[item] || item
        )
        .filter(
            item =>
                courseNames[item]
        );
}


/* =========================================================

/* =========================================================

function renderEnrolledCourses(
    enrollments,

) {

    if (!enrollments.length) {
        return "";
    }


    let html = `

        <section class="section">

            <div class="section-heading">

                <h2>
                    My Enrolled Courses
                </h2>

                    ${enrollments.length}

                        enrollments.length === 1
                        ? "Course"
                        : "Courses"
                    }

    `;


    enrollments.forEach(
        enrollment => {

            const course =
                enrollment.courses;


            if (!course) {
                return;
            }


            const slug =
                course.slug;


            const facilities =
                courseFacilities[slug] ||
                [];

                contains this course.

                verifiedOrders.find(

                        const categories =
                            normalizeCategories(

                            );

/* =========================================================
   LOAD PAGE
========================================================= */

async function loadPage() {

    const content =
        document.getElementById(
            "content"
        );


    try {

        /* =========================
           AUTH CHECK
        ========================= */

        const {
            data: {
                user
            }
        } =
            await supabaseClient
                .auth
                .getUser();


        if (!user) {

            window.location.href =
                "index.html";

            return;
        }


        /* =========================
           PROFILE
        ========================= */

        const {
            data: profile,
            error: profileError
        } =
            await supabaseClient
                .from("profiles")
                .select(`
                    full_name
                `)
                .eq(
                    "id",
                    user.id
                )
                .maybeSingle();


        if (profileError) {
            console.warn(
                "Profile warning:",
                profileError
            );
        }


        /* =========================
           ORDERS
        ========================= */

        const {
            data: orders,
            error: ordersError
        } =
            await supabaseClient
                .from("orders")
                .select(`
                    id,
                    user_id,
                    package_type,
                    selected_categories,
                    hsc_roll,
                    hsc_registration,
                    amount,
                    currency,
                    payment_method,
                    transaction_id,
                    payment_status,
                    created_at
                `)
                .eq(
                    "user_id",
                    user.id
                )
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        if (ordersError) {
            throw ordersError;
        }


        /* =========================
           ADD STUDENT INFORMATION
        ========================= */

        const enrichedOrders =
            (orders || [])
                .map(
                    order => ({

                        ...order,

                        student_name:
                            profile?.full_name ||
                            user.user_metadata?.full_name ||
                            "Student",

                        email:
                            user.email || ""
                    })
                );


        /* =========================
           ENROLLMENTS
        ========================= */

        const {
            data: enrollments,
            error: enrollmentError
        } =
            await supabaseClient
                .from("enrollments")
                .select(`
                    id,
                    user_id,
                    course_id,
                    order_id,
                    status,
                    progress_percent,
                    enrolled_at,
                    courses (
                        id,
                        name,
                        slug,
                        category,
                        description,
                        is_active
                    )
                `)
                .eq(
                    "user_id",
                    user.id
                )
                .order(
                    "enrolled_at",
                    {
                        ascending: false
                    }
                );


        if (enrollmentError) {
            throw enrollmentError;
        }


        /* =========================
           FILTER ORDERS
        ========================= */

        const pendingOrders =
            enrichedOrders.filter(
                order =>
                    order.payment_status ===
                    "pending"
            );


        const rejectedOrders =
            enrichedOrders.filter(
                order =>
                    order.payment_status ===
                    "rejected"
            );


        const verifiedOrders =
            enrichedOrders.filter(
                order =>
                    order.payment_status ===
                    "verified"
            );


        /* =========================
           ACTIVE ENROLLMENTS
        ========================= */

        const activeEnrollments =
            (enrollments || [])
                .filter(
                    enrollment =>
                        enrollment.status ===
                            "active" ||
                        enrollment.status ===
                            "enrolled"
                );


        /* =========================
           ABSOLUTE EMPTY STATE
        ========================= */

        if (
            !pendingOrders.length &&
            !rejectedOrders.length &&
            !activeEnrollments.length
        ) {

            content.innerHTML = `

                <div class="state-card">

                    <div class="state-icon">
                        📚
                    </div>

                    <h2>
                        You Have No Enrolled Courses
                    </h2>

                    <p>
                        You haven't enrolled in any
                        Dream Hunt course yet.
                        Explore our admission programs
                        and start your preparation today.
                    </p>

                    <a
                        href="buy-courses.html"
                        class="primary-btn"
                    >
                        Browse Courses
                    </a>

                </div>
            `;

            return;
        }


        /* =========================
           BUILD PAGE
        ========================= */

        let html = "";


        /* =========================
           ENROLLED
        ========================= */

        if (
            activeEnrollments.length
        ) {

            html +=
                renderEnrolledCourses(
                    activeEnrollments,
                    verifiedOrders
                );
        }


        /* =========================
           PENDING
        ========================= */

        if (
            pendingOrders.length
        ) {

            html +=
                renderPendingOrders(
                    pendingOrders
                );
        }


        /* =========================
           REJECTED
        ========================= */

        if (
            rejectedOrders.length
        ) {

            html +=
                renderRejectedOrders(
                    rejectedOrders
                );
        }


        /* =========================
           OUTPUT
        ========================= */

        content.innerHTML =
            html;


    } catch (error) {

        console.error(
            "Enrolled Courses Error:",
            error
        );


        content.innerHTML = `

            <div class="error">

                <strong>
                    Something went wrong.
                </strong>

                <br><br>

                We couldn't load your
                enrollment information.

                <br>

                Please refresh the page
                and try again.

            </div>
        `;
    }
}
