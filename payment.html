<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dream Hunt | Payment</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Inter,Arial,sans-serif;
    background:
        radial-gradient(circle at top left,#172554 0%,transparent 35%),
        radial-gradient(circle at bottom right,#312e81 0%,transparent 35%),

    color:#fff;
    min-height:100vh;
}

.navbar{
    height:70px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 7%;
    border-bottom:1px solid rgba(255,255,255,.08);
    background:rgba(5,8,22,.75);
    backdrop-filter:blur(18px);
    position:sticky;
    top:0;
    z-index:20;
}

.logo{
    font-size:23px;
    font-weight:900;
    letter-spacing:.5px;
}

.logo span{
    color:#8b5cf6;
}

.nav-btn{
    border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.06);
    color:white;
    padding:10px 17px;
    border-radius:12px;
    cursor:pointer;
    font-weight:700;
}

.container{
    width:min(1100px,92%);
    margin:40px auto 70px;
}

.hero{
    margin-bottom:25px;
}

.hero h1{
    font-size:clamp(30px,6vw,48px);
    line-height:1.05;
    font-weight:950;
}

.hero h1 span{
    color:#a78bfa;
}

.hero p{
    margin-top:10px;
    color:#9ca3af;
    line-height:1.6;
}

.grid{
    display:grid;
    grid-template-columns:1.15fr .85fr;
    gap:22px;
}

.card{
    background:rgba(15,23,42,.72);
    border:1px solid rgba(255,255,255,.09);
    border-radius:22px;
    padding:24px;
    box-shadow:0 20px 70px rgba(0,0,0,.25);
    backdrop-filter:blur(18px);
}

.card h2{
    font-size:20px;
    margin-bottom:18px;
}

.section{
    margin-bottom:25px;
}

.package{
    display:flex;
    justify-content:space-between;
    gap:15px;
    padding:16px;
    border-radius:16px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.07);

}

.package-title{

}

.package-sub{

    font-size:13px;

}

.price{

}

.summary-row{

    justify-content:space-between;

    padding:11px 0;
    color:#cbd5e1;
}

.summary-row.total{
    margin-top:12px;
    padding-top:18px;
    border-top:1px solid rgba(255,255,255,.1);

    font-size:22px;
    font-weight:950;
}

.discount{

}

.payment-methods{

.method:hover{

}

.method.active{

}

.method strong{

}

.method small{
    color:#94a3b8;
}

label{
    display:block;

    font-size:13px;
    font-weight:700;
    color:#cbd5e1;
}

input{
    width:100%;
    padding:14px 15px;

    border:1px solid rgba(255,255,255,.1);

    color:white;

input:focus{
    border-color:#8b5cf6;
    box-shadow:0 0 0 3px rgba(139,92,246,.1);
}

.pay-number{

    border-radius:14px;

}

.pay-number small{
    display:block;
    color:#a5b4fc;
    margin-bottom:5px;

.pay-number strong{

}

.submit{

    border-radius:15px;
    background:linear-gradient(135deg,#7c3aed,#4f46e5);

    font-size:16px;
    font-weight:900;
    cursor:pointer;

}

.submit:hover{
    transform:translateY(-1px);
}

.submit:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.notice{
    padding:14px;
    border-radius:13px;
    background:rgba(245,158,11,.08);
    border:1px solid rgba(245,158,11,.25);
    color:#fcd34d;
    font-size:13px;
    line-height:1.6;
    margin-bottom:15px;
}

.error{
    padding:14px;
    border-radius:13px;
    background:rgba(239,68,68,.08);
    border:1px solid rgba(239,68,68,.3);
    color:#fca5a5;
    font-size:13px;
    line-height:1.6;
    margin-bottom:15px;
}

.success{
    text-align:center;
    padding:30px 15px;
}

.success-icon{
    width:70px;
    height:70px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin:0 auto 18px;
    border-radius:50%;
    background:rgba(34,197,94,.12);
    border:1px solid rgba(34,197,94,.35);
    color:#4ade80;
    font-size:34px;

.success h2{
    color:#4ade80;

}

.status{

    background:rgba(245,158,11,.12);
    color:#fbbf24;

    font-weight:900;
    letter-spacing:1px;
}

.details{
    text-align:left;
    background:rgba(255,255,255,.04);
    border-radius:15px;
    padding:16px;

.detail{

.detail span:first-child{

}

.detail span:last-child{

}

.back{
    margin-top:15px;

    padding:13px;
    border-radius:13px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.04);
    color:white;
    font-weight:800;
    cursor:pointer;
}

.empty{
    color:#94a3b8;
    line-height:1.7;
    padding:20px 0;
}

@media(max-width:800px){

    .grid{
        grid-template-columns:1fr;
    }

    .navbar{
        padding:0 4%;
    }

    .container{
        width:94%;
        margin-top:25px;
    }

    .card{
        padding:18px;
    }

}

<nav class="navbar">

<main class="container">

                    >

                <div class="pay-number">

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://rndtgjuwwsxxiiezennr.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_mIQfKUUsEOlDtqEdroMpgQ_I8ElRcsN";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   GLOBALS
========================================================= */

let checkout = null;

let selectedMethod = "bKash";


/* =========================================================
   LOAD CHECKOUT
========================================================= */

function loadCheckout(){

    const primary =
        localStorage.getItem(
            "dreamHuntCheckout"
        );

    const secondary =
        localStorage.getItem(
            "dream_hunt_course_order"
        );

    let raw = primary || secondary;

    if(!raw){

        showError(
            "No checkout information was found. Please return to Buy Courses and select your package again."
        );

        document.getElementById(
            "paymentArea"
        ).style.display = "none";

        return false;
    }

    try{

        checkout = JSON.parse(raw);

    }catch(error){

        console.error(error);

        showError(
            "Your checkout information is invalid. Please select your package again."
        );

        document.getElementById(
            "paymentArea"
        ).style.display = "none";

        return false;
    }

    renderCheckout();

    return true;
}


/* =========================================================
   RENDER CHECKOUT
========================================================= */

function renderCheckout(){

    const box =
        document.getElementById(
            "selectedPackage"
        );

    const selected =
        Array.isArray(checkout.selectedItems)
            ? checkout.selectedItems
            : (
                Array.isArray(checkout.selected)
                    ? checkout.selected
                    : []
            );

    let html = "";

    if(selected.length){

        selected.forEach(item => {

            let title =
                item.name ||
                item.title ||
                item.label ||
                item.category ||
                "Selected Course";

            let subtitle =
                item.subtitle ||
                item.unit ||
                item.description ||
                "";

            html += `
                <div class="package">

                    <div>

                        <div class="package-title">
                            ${escapeHTML(title)}
                        </div>

                        ${
                            subtitle
                                ? `
                                <div class="package-sub">
                                    ${escapeHTML(subtitle)}
                                </div>
                                `
                                : ""
                        }

                    </div>

                </div>
            `;

        });

    }else{

        const categories =
            Array.isArray(checkout.categories)
                ? checkout.categories
                : [];

        categories.forEach(category => {

            html += `
                <div class="package">

                    <div class="package-title">
                        ${escapeHTML(category)}
                    </div>

                </div>
            `;

        });

    }


    const subtotal =
        Number(checkout.subtotal || 0);

    const discount =
        Number(checkout.discount || 0);

    const total =
        Number(
            checkout.finalAmount ??
            checkout.payableAmount ??
            checkout.totalAmount ??
            checkout.amount ??
            checkout.total ??
            0
        );


    html += `

        <div style="margin-top:20px">

            <div class="summary-row">
                <span>Subtotal</span>
                <strong>৳${formatMoney(subtotal)}</strong>
            </div>

            ${
                discount > 0
                ? `
                    <div class="summary-row">
                        <span>Coupon Discount</span>
                        <strong class="discount">
                            -৳${formatMoney(discount)}
                        </strong>
                    </div>
                `
                : ""
            }

            <div class="summary-row total">
                <span>Total</span>
                <strong>৳${formatMoney(total)}</strong>
            </div>

        </div>
    `;


    box.innerHTML = html;
}


/* =========================================================
   PAYMENT METHOD
========================================================= */

function selectMethod(element){

    document
        .querySelectorAll(".method")
        .forEach(el => {

            el.classList.remove("active");

        });


    element.classList.add("active");

    selectedMethod =
        element.dataset.method;
}


/* =========================================================
   CATEGORY → COURSE NAME
========================================================= */

const COURSE_NAME_MAP = {

    engineering:
        "Engineering Admission",

    medical:
        "Medical & Dental Admission",

    dental:
        "Medical & Dental Admission",

    "medical-dental":
        "Medical & Dental Admission",

    agricultural:
        "Agriculture & Veterinary Admission",

    agriculture:
        "Agriculture & Veterinary Admission",

    "agriculture-veterinary":
        "Agriculture & Veterinary Admission",

    textile:
        "Specialized Admission",

    specialized:
        "Specialized Admission",

    "public-university":
        "Public University Admission",

    public:
        "Public University Admission",

    "public university":
        "Public University Admission",

    ab:
        "Abroad Preparation",

    abroad:
        "Abroad Preparation",

    "abroad-preparation":
        "Abroad Preparation"

};


/* =========================================================
   NORMALIZE
========================================================= */

function normalize(value){

    return String(value || "")
        .trim()
        .toLowerCase()
        .replace(/&/g,"and")
        .replace(/[^a-z0-9]+/g," ")
        .trim();
}


/* =========================================================
   GET CHECKOUT CATEGORIES
========================================================= */

function getCheckoutCategories(){

    let categories = [];

    if(
        checkout &&
        Array.isArray(checkout.categories)
    ){

        categories =
            checkout.categories;

    }

    if(
        !categories.length &&
        checkout &&
        Array.isArray(checkout.orderCategories)
    ){

        categories =
            checkout.orderCategories;

    }


    if(
        !categories.length &&
        checkout &&
        Array.isArray(checkout.courseSlugs)
    ){

        categories =
            checkout.courseSlugs;

    }


    return [
        ...new Set(
            categories
                .map(x => normalize(x))
                .filter(Boolean)
        )
    ];
}


/* =========================================================
   FIND EXISTING COURSE IDS
   IMPORTANT:
   We fetch existing courses and match by NAME.
   No schema change.
========================================================= */

async function findCourseIds(){

    const {
        data,
        error
    } = await supabaseClient
        .from("courses")
        .select(
            "id,name,slug,category,is_active,is_published"
        );


    if(error){

        console.error(
            "Course query error:",
            error
        );

        throw new Error(
            "Could not read available courses from Supabase."
        );
    }


    if(!Array.isArray(data) || !data.length){

        throw new Error(
            "No courses were found in the Dream Hunt courses table."
        );
    }


    console.log(
        "Courses returned by Supabase:",
        data
    );


    const categories =
        getCheckoutCategories();


    const requiredNames = [];


    categories.forEach(category => {

        const mapped =
            COURSE_NAME_MAP[category];

        if(mapped){

            requiredNames.push(
                normalize(mapped)
            );

        }

    });


    /*
       If checkout contains selectedItems instead
       of categories, inspect their names too.
    */

    if(
        !requiredNames.length &&
        checkout &&
        Array.isArray(checkout.selectedItems)
    ){

        checkout.selectedItems.forEach(item => {

            const text =
                normalize(
                    item.name ||
                    item.title ||
                    item.category ||
                    ""
                );

            if(text){

                requiredNames.push(text);

            }

        });

    }


    const uniqueRequired =
        [...new Set(requiredNames)];


    const matched = [];


    uniqueRequired.forEach(required => {

        let row =
            data.find(course =>
                normalize(course.name) === required
            );


        /*
           Fallback:
           partial name matching.
        */

        if(!row){

            row =
                data.find(course => {

                    const name =
                        normalize(course.name);

                    return (
                        name.includes(required) ||
                        required.includes(name)
                    );

                });

        }


        if(row){

            if(
                !matched.some(
                    x => x.id === row.id
                )
            ){

                matched.push(row);

            }

        }

    });


    /*
       If exact checkout categories could not be mapped,
       try direct matching against all existing names.
    */

    if(!matched.length){

        categories.forEach(category => {

            const mapped =
                COURSE_NAME_MAP[category];

            if(!mapped) return;

            const mappedNormalized =
                normalize(mapped);


            const row =
                data.find(course =>
                    normalize(course.name)
                    .includes(mappedNormalized)
                );


            if(
                row &&
                !matched.some(
                    x => x.id === row.id
                )
            ){

                matched.push(row);

            }

        });

    }


    if(!matched.length){

        console.error(
            "Checkout categories:",
            categories
        );

        console.error(
            "Required names:",
            uniqueRequired
        );

        console.error(
            "Available courses:",
            data
        );

        throw new Error(
            "Invalid or unavailable course. Please return to Buy Courses and select your package again."
        );
    }


    return matched;

}


/* =========================================================
   BUILD RPC PRICES
========================================================= */

function buildRPCPrices(courseRows){

    const total =
        Number(
            checkout.finalAmount ??
            checkout.payableAmount ??
            checkout.totalAmount ??
            checkout.amount ??
            checkout.total ??
            0
        );


    /*
       Existing RPC only accepts:

       p_course_ids
       p_prices

       So the complete checkout total is attached
       to the first course and remaining prices are 0.

       No Supabase schema change.
    */

    return courseRows.map(
        (_, index) =>
            index === 0
                ? total
                : 0
    );
}


/* =========================================================
   SUBMIT PAYMENT
========================================================= */

async function submitPayment(){

    const submitBtn =
        document.getElementById(
            "submitBtn"
        );


    const transactionId =
        document
            .getElementById(
                "transactionId"
            )
            .value
            .trim();


    const hscRoll =
        document
            .getElementById(
                "hscRoll"
            )
            .value
            .trim();


    const hscRegistration =
        document
            .getElementById(
                "hscRegistration"
            )
            .value
            .trim();


    if(!transactionId){

        showError(
            "Please enter your Transaction ID."
        );

        return;
    }


    if(!hscRoll){

        showError(
            "Please enter your HSC Roll."
        );

        return;
    }


    if(!hscRegistration){

        showError(
            "Please enter your HSC Registration."
        );

        return;
    }


    submitBtn.disabled = true;

    submitBtn.innerText =
        "Checking account...";


    try{

        /*
           Check login
        */

        const {
            data: userData,
            error: userError
        } =
            await supabaseClient
                .auth
                .getUser();


        if(
            userError ||
            !userData ||
            !userData.user
        ){

            window.location.href =
                "login.html?redirect=payment.html";

            return;
        }


        submitBtn.innerText =
            "Finding course...";


        /*
           Find existing DB course IDs
           by course name.
        */

        const courseRows =
            await findCourseIds();


        if(
            !courseRows ||
            !courseRows.length
        ){

            throw new Error(
                "Invalid or unavailable course."
            );
        }


        const courseIds =
            courseRows.map(
                row => row.id
            );


        const prices =
            buildRPCPrices(
                courseRows
            );


        console.log(
            "Matched courses:",
            courseRows
        );


        console.log(
            "RPC course IDs:",
            courseIds
        );


        console.log(
            "RPC prices:",
            prices
        );


        submitBtn.innerText =
            "Submitting order...";


        /*
           Existing RPC
        */

        const {
            data: orderData,
            error: orderError
        } =
            await supabaseClient
                .rpc(
                    "create_student_order",
                    {
                        p_course_ids:
                            courseIds,

                        p_prices:
                            prices
                    }
                );


        if(orderError){

            console.error(
                "RPC error:",
                orderError
            );

            throw new Error(
                orderError.message ||
                "Could not create your order."
            );
        }


        /*
           RPC may return UUID directly
           OR an object containing order id.
        */

        let orderId =
            extractOrderId(
                orderData
            );


        if(!orderId){

            /*
               Generate a local reference if
               RPC response doesn't expose one.
            */

            orderId =
                "DH-" +
                Date.now();

        }


        /*
           Existing RPC does not accept payment
           method / TRX / HSC information.

           Therefore these details are stored
           locally for now.
        */

        const paymentRecord = {

            order_id:
                orderId,

            user_id:
                userData.user.id,

            payment_method:
                selectedMethod,

            transaction_id:
                transactionId,

            hsc_roll:
                hscRoll,

            hsc_registration:
                hscRegistration,

            amount:
                Number(
                    checkout.finalAmount ??
                    checkout.payableAmount ??
                    checkout.totalAmount ??
                    checkout.amount ??
                    checkout.total ??
                    0
                ),

            status:
                "PENDING",

            created_at:
                new Date().toISOString()

        };


        localStorage.setItem(
            "dreamHuntPayment_" + orderId,
            JSON.stringify(
                paymentRecord
            )
        );


        localStorage.setItem(
            "dreamHuntLatestPayment",
            JSON.stringify(
                paymentRecord
            )
        );


        showSuccess(
            paymentRecord,
            courseRows
        );


    }catch(error){

        console.error(
            error
        );

        showError(
            error.message ||
            "Something went wrong while submitting your payment."
        );


        submitBtn.disabled = false;

        submitBtn.innerText =
            "Submit Payment";

    }

}


/* =========================================================
   EXTRACT ORDER ID
========================================================= */

function extractOrderId(data){

    if(!data){

        return null;
    }


    if(typeof data === "string"){

        return data;
    }


    if(
        typeof data === "object"
    ){

        return (
            data.id ||
            data.order_id ||
            data.orderId ||
            data[0]?.id ||
            data[0]?.order_id ||
            data[0]?.orderId ||
            null
        );

    }


    return null;
}

    document.getElementById(
        "message"

}

/* =========================================================
   FORMAT MONEY
========================================================= */

function formatMoney(value){

    return Number(
        value || 0
    ).toLocaleString(
        "en-BD"
    );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}
