<script>

/* =========================================================
   HELPERS
========================================================= */

function escapeHTML(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function formatDate(date) {

    if (!date) return "—";

    return new Date(date).toLocaleString(
        "en-BD",
        {
            day: "2-digit",
            month: "short",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}


function formatAmount(amount) {

    return "৳" + Number(amount || 0).toLocaleString("en-BD");
}


function normalizeCategories(categories) {

    if (!Array.isArray(categories)) {
        return [];
    }

    const slugMap = {

        "Public University":
            "public-university",

        "Public University Admission":
            "public-university",

        "Engineering":
            "engineering",

        "Engineering Admission":
            "engineering",

        "Medical":
            "medical-dental",

        "Medical & Dental":
            "medical-dental",

        "Medical & Dental Admission":
            "medical-dental",

        "Agriculture":
            "agriculture-veterinary",

        "Agriculture & Veterinary":
            "agriculture-veterinary",

        "Agriculture & Veterinary Admission":
            "agriculture-veterinary",

        "Specialized":
            "specialized-admission",

        "Specialized Admission":
            "specialized-admission",

        "Abroad":
            "abroad-prep",

        "Abroad Prep":
            "abroad-prep",

        "Abroad Preparation":
            "abroad-prep"
    };

    return categories
        .map(item => slugMap[item] || item)
        .filter(item => courseNames[item]);
}


function getStatusClass(status) {

    if (status === "verified") return "verified";

    if (status === "rejected") return "rejected";

    return "pending";
}


function getStatusText(status) {

    if (status === "verified") {
        return "Verified";
    }

    if (status === "rejected") {
        return "Rejected";
    }

    return "Pending";
}


/* =========================================================
   PAYMENT SLIP
========================================================= */

function showPaymentSlip(order) {

    const categories =
        normalizeCategories(order.selected_categories);

    const names =
        categories.map(
            slug => courseNames[slug]
        );

    const statusClass =
        getStatusClass(order.payment_status);

    const statusText =
        getStatusText(order.payment_status);

    document.getElementById("slipContent").innerHTML = `

        <div class="slip-brand">
            <h2>DREAM HUNT</h2>
            <p>Admission Preparation Platform</p>
        </div>

        <div class="slip-status">
            <span class="status ${statusClass}">
                ${statusText}
            </span>
        </div>

        <div class="slip-row">
            <span>Student</span>
            <span>${escapeHTML(order.student_name || "—")}</span>
        </div>

        <div class="slip-row">
            <span>Email</span>
            <span>${escapeHTML(order.email || "—")}</span>
        </div>

        <div class="slip-row">
            <span>Package</span>
            <span>${escapeHTML(order.package_type || "—")}</span>
        </div>

        <div class="slip-row">
            <span>Selected Courses</span>
            <span>${names.map(escapeHTML).join("<br>") || "—"}</span>
        </div>

        <div class="slip-row">
            <span>Amount</span>
            <span>${formatAmount(order.amount)}</span>
        </div>

        <div class="slip-row">
            <span>Payment Method</span>
            <span>${escapeHTML(order.payment_method || "—")}</span>
        </div>

        <div class="slip-row">
            <span>TRX ID</span>
            <span>${escapeHTML(order.transaction_id || "—")}</span>
        </div>

        <div class="slip-row">
            <span>HSC Roll</span>
            <span>${escapeHTML(order.hsc_roll || "—")}</span>
        </div>

        <div class="slip-row">
            <span>HSC Registration</span>
            <span>${escapeHTML(order.hsc_registration || "—")}</span>
        </div>

        <div class="slip-row">
            <span>Submitted</span>
            <span>${formatDate(order.created_at)}</span>
        </div>

        <div class="slip-footer">
            This is a digital payment submission receipt generated by Dream Hunt.
        </div>

        <div class="modal-actions">
            <button class="close-btn" onclick="closeSlip()">
                Close
            </button>
            <button class="primary-btn"
                style="margin-top:0"
                onclick="window.print()">
                Print
            </button>
        </div>
    `;

    document
        .getElementById("slipModal")
        .classList.add("show");
}


function closeSlip() {

    document
        .getElementById("slipModal")
        .classList.remove("show");
}


document
    .getElementById("slipModal")
    .addEventListener("click", function(e) {

        if (e.target === this) {
            closeSlip();
        }

    });


/* =========================================================
   RENDER PENDING PAYMENT
========================================================= */

function renderPendingOrders(orders) {

    if (!orders.length) {
        return "";
    }

    let html = `

        <section class="section">

            <div class="section-heading">
                <h2>Payment Status</h2>

                <span class="count-badge">
                    ${orders.length}
                    ${orders.length === 1 ? "Payment" : "Payments"}
                </span>
            </div>
    `;


    orders.forEach(order => {

        const categories =
            normalizeCategories(order.selected_categories);

        const names =
            categories.map(
                slug => courseNames[slug]
            );


        html += `

            <div class="payment-card">

                <div class="payment-header">

                    <div>
                        <h3>
                            ${escapeHTML(
                                order.package_type || "Course Package"
                            )}
                        </h3>

                        <p>
                            Your payment has been submitted and is waiting for approval.
                        </p>
                    </div>

                    <span class="status ${getStatusClass(order.payment_status)}">
                        ${getStatusText(order.payment_status)}
                    </span>

                </div>


                <div class="details-grid">

                    <div class="detail">
                        <small>Amount</small>
                        <strong>${formatAmount(order.amount)}</strong>
                    </div>

                    <div class="detail">
                        <small>Payment Method</small>
                        <strong>${escapeHTML(order.payment_method || "—")}</strong>
                    </div>

                    <div class="detail">
                        <small>TRX ID</small>
                        <strong>${escapeHTML(order.transaction_id || "—")}</strong>
                    </div>

                    <div class="detail">
                        <small>Submitted</small>
                        <strong>${formatDate(order.created_at)}</strong>
                    </div>

                    <div class="detail">
                        <small>HSC Roll</small>
                        <strong>${escapeHTML(order.hsc_roll || "—")}</strong>
                    </div>

                    <div class="detail">
                        <small>HSC Registration</small>
                        <strong>${escapeHTML(order.hsc_registration || "—")}</strong>
                    </div>

                </div>


                <div class="selected-courses">

                    <h4>Selected Courses</h4>

                    ${
                        names.length
                        ? names.map(
                            name =>
                                `<span class="course-chip">${escapeHTML(name)}</span>`
                          ).join("")
                        : `<span class="course-chip">Course information unavailable</span>`
                    }

                </div>


                <button
                    class="slip-btn"
                    style="margin-top:15px"
                    onclick='showPaymentSlip(${JSON.stringify(order).replace(/'/g, "&#039;")})'
                >
                    View Payment Slip
                </button>

            </div>
        `;
    });


    html += `</section>`;

    return html;
}


/* =========================================================
   RENDER VERIFIED COURSES
========================================================= */

function renderEnrolledCourses(enrollments) {

    if (!enrollments.length) {
        return `
            <section class="section">

                <div class="state-card">

                    <div class="state-icon">
                        📚
                    </div>

                    <h2>You Have No Enrolled Courses</h2>

                    <p>
                        You haven't enrolled in any Dream Hunt course yet.
                        Choose your admission category and start your preparation.
                    </p>

                    <a
                        href="buy-courses.html"
                        class="primary-btn"
                    >
                        Browse Courses
                    </a>

                </div>

            </section>
        `;
    }


    let html = `

        <section class="section">

            <div class="section-heading">

                <h2>My Enrolled Courses</h2>

                <span class="count-badge">
                    ${enrollments.length}
                    ${enrollments.length === 1 ? "Course" : "Courses"}
                </span>

            </div>
    `;


    enrollments.forEach(enrollment => {

        const course =
            enrollment.courses;

        if (!course) return;

        const slug =
            course.slug;

        const facilities =
            courseFacilities[slug] || [];


        html += `

            <div class="course-card">

                <div class="course-top">

                    <div class="course-title-wrap">

                        <h3>
                            ${escapeHTML(course.name)}
                        </h3>

                        <p>
                            ${escapeHTML(
                                course.description ||
                                courseDescriptions[slug] ||
                                ""
                            )}
                        </p>

                    </div>

                    <span class="enrolled-badge">
                        ✓ Enrolled
                    </span>

                </div>


                <div class="course-details">

                    <div class="facility-box">

                        <h4>
                            Course Coverage
                        </h4>

                        <ul>

                            ${
                                facilities
                                    .map(
                                        item =>
                                            `<li>${escapeHTML(item)}</li>`
                                    )
                                    .join("")
                            }

                        </ul>

                    </div>


                    <div class="facility-box">

                        <h4>
                            Your Course
                        </h4>

                        <ul>

                            <li>
                                Admission-focused preparation
                            </li>

                            <li>
                                Previous Years' Questions
                            </li>

                            <li>
                                Important & Marked Questions
                            </li>

                            <li>
                                Formula & Shortcuts
                            </li>

                            <li>
                                Regular Exams
                            </li>

                            <li>
                                Performance Ranking
                            </li>

                        </ul>

                    </div>

                </div>


                <div class="course-actions">

                    <button
                        class="continue-btn"
                        onclick="openCourse('${escapeHTML(slug)}')"
                    >
                        Continue Learning
                    </button>

                </div>

            </div>
        `;
    });


    html += `</section>`;

    return html;
}


/* =========================================================

========================================================= */

function openCourse(slug) {

    /*

    */

    alert(

}


/* =========================================================
   LOAD DATA
========================================================= */

async function loadPage() {

    const content =
        document.getElementById("content");


    try {

        /* AUTH */

        const {
            data: {
                user
            }
        } =
            await supabaseClient.auth.getUser();


        if (!user) {

            window.location.href =
                "index.html";

            return;
        }


        /* PROFILE */

        const {
            data: profile
        } =
            await supabaseClient
                .from("profiles")
                .select(`
                    full_name
                `)
                .eq("id", user.id)
                .maybeSingle();


        /* ORDERS */

        const {
            data: orders,
            error: ordersError
        } =
            await supabaseClient
                .from("orders")
                .select(`
                    id,
                    user_id,
                    package_type,
                    selected_categories,
                    hsc_roll,
                    hsc_registration,
                    amount,
                    currency,
                    payment_method,
                    transaction_id,
                    payment_status,
                    created_at
                `)
                .eq("user_id", user.id)
                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


        if (ordersError) {
            throw ordersError;
        }


        /* ADD USER INFO FOR SLIP */

        const enrichedOrders =
            (orders || []).map(order => ({
                ...order,
                student_name:
                    profile?.full_name ||
                    user.user_metadata?.full_name ||
                    "Student",
                email:
                    user.email || ""
            }));


        /* ENROLLMENTS */

        const {
            data: enrollments,
            error: enrollmentError
        } =
            await supabaseClient
                .from("enrollments")
                .select(`
                    id,
                    user_id,
                    course_id,
                    order_id,
                    status,
                    progress_percent,
                    enrolled_at,
                    courses (
                        id,
                        name,
                        slug,
                        category,
                        description,
                        is_active
                    )
                `)
                .eq("user_id", user.id)
                .order(
                    "enrolled_at",
                    {
                        ascending: false
                    }
                );


        if (enrollmentError) {
            throw enrollmentError;
        }


        /* FILTER */

        const pendingOrders =
            enrichedOrders.filter(
                order =>
                    order.payment_status === "pending"
            );


        const rejectedOrders =
            enrichedOrders.filter(
                order =>
                    order.payment_status === "rejected"
            );


        const verifiedOrders =
            enrichedOrders.filter(
                order =>
                    order.payment_status === "verified"
            );


        const activeEnrollments =
            (enrollments || []).filter(
                enrollment =>
                    enrollment.status === "active" ||
                    enrollment.status === "enrolled"
            );


        /* EMPTY STATE */

        if (
            !pendingOrders.length &&
            !rejectedOrders.length &&
            !activeEnrollments.length
        ) {

            content.innerHTML = `

                <div class="state-card">

                    <div class="state-icon">
                        📚
                    </div>

                    <h2>
                        You Have No Enrolled Courses
                    </h2>

                    <p>
                        You haven't enrolled in any course yet.
                        Explore Dream Hunt's admission programs and
                        start your preparation today.
                    </p>

                    <a
                        href="buy-courses.html"
                        class="primary-btn"
                    >
                        Browse Courses
                    </a>

                </div>
            `;

            return;
        }


        /* BUILD PAGE */

        let html = "";


        /* VERIFIED COURSES */

        if (activeEnrollments.length) {

            html += renderEnrolledCourses(
                activeEnrollments
            );

        } else {

            /*
                If user has only pending/rejected payments,
                show an informative state.
            */

            if (
                pendingOrders.length ||
                rejectedOrders.length
            ) {

                html += `

                    <section class="section">

                        <div class="state-card">

                            <div class="state-icon">
                                ⏳
                            </div>

                            <h2>
                                Your Courses Are Not Active Yet
                            </h2>

                            <p>
                                Your submitted payment is being processed.
                                Your course will appear here automatically
                                after the payment is verified.
                            </p>

                        </div>

                    </section>
                `;
            }
        }


        /* PENDING */

        html += renderPendingOrders(
            pendingOrders
        );


        /* REJECTED */

        if (rejectedOrders.length) {

            html += `

                <section class="section">

                    <div class="section-heading">

                        <h2>
                            Payment Updates
                        </h2>

                    </div>
            `;


            rejectedOrders.forEach(order => {

                const categories =
                    normalizeCategories(
                        order.selected_categories
                    );

                const names =
                    categories.map(
                        slug =>
                            courseNames[slug]
                    );


                html += `

                    <div
                        class="payment-card"
                        style="
                            border-color:#fecaca;
                            border-left-color:#ef4444;
                        "
                    >

                        <div class="payment-header">

                            <div>

                                <h3>
                                    ${escapeHTML(
                                        order.package_type ||
                                        "Course Package"
                                    )}
                                </h3>

                                <p>
                                    This payment was rejected.
                                    Please contact Dream Hunt support
                                    if you believe this was a mistake.
                                </p>

                            </div>

                            <span class="status rejected">
                                Rejected
                            </span>

                        </div>


                        <div class="details-grid">

                            <div class="detail">
                                <small>Amount</small>
                                <strong>
                                    ${formatAmount(order.amount)}
                                </strong>
                            </div>

                            <div class="detail">
                                <small>Payment Method</small>
                                <strong>
                                    ${escapeHTML(
                                        order.payment_method || "—"
                                    )}
                                </strong>
                            </div>

                            <div class="detail">
                                <small>TRX ID</small>
                                <strong>
                                    ${escapeHTML(
                                        order.transaction_id || "—"
                                    )}
                                </strong>
                            </div>

                            <div class="detail">
                                <small>Submitted</small>
                                <strong>
                                    ${formatDate(order.created_at)}
                                </strong>
                            </div>

                        </div>


                        <div class="selected-courses">

                            <h4>
                                Submitted Courses
                            </h4>

                            ${
                                names.map(
                                    name =>
                                        `<span class="course-chip">${escapeHTML(name)}</span>`
                                ).join("")
                            }

                        </div>


                        <button
                            class="slip-btn"
                            style="margin-top:15px"
                            onclick='showPaymentSlip(${JSON.stringify(order).replace(/'/g, "&#039;")})'
                        >
                            View Payment Slip
                        </button>

                    </div>
                `;
            });


            html += `</section>`;
        }


        content.innerHTML =
            html;


    } catch (error) {

        console.error(
            "Enrolled courses error:",
            error
        );

        content.innerHTML = `

            <div class="error">

                Something went wrong while loading
                your course information.

                <br><br>

                Please refresh the page and try again.

            </div>
        `;
    }
}

loadPage();
